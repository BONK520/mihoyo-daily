<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="每日清单">
  <meta name="description" content="原神、崩坏：星穹铁道、绝区零的每日/每周清单与体力计算器">
  <title>米哈游每日清单</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body data-game="home">
  <header class="topbar">
    <div class="topbar-inner">
      <h1 id="title">米哈游每日清单</h1>
      <div class="clock" id="clock" aria-label="亚服时间"></div>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="分页">
    <a href="#home" data-tab="home">
      <span class="tab-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg>
      </span>
      <span class="tab-label">首页</span>
    </a>
    <a href="#genshin" data-tab="genshin" class="tab-genshin">
      <span class="tab-icon glyph" aria-hidden="true">原</span>
      <span class="tab-label">原神</span>
    </a>
    <a href="#hsr" data-tab="hsr" class="tab-hsr">
      <span class="tab-icon glyph" aria-hidden="true">星</span>
      <span class="tab-label">星铁</span>
    </a>
    <a href="#zzz" data-tab="zzz" class="tab-zzz">
      <span class="tab-icon glyph" aria-hidden="true">绝</span>
      <span class="tab-label">绝区零</span>
    </a>
    <a href="#settings" data-tab="settings">
      <span class="tab-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="3"/><circle cx="10" cy="17" r="3"/></svg>
      </span>
      <span class="tab-label">设置</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">这个页面需要开启 JavaScript 才能使用。</p></noscript>
  <script src="app.js"></script>
</body>
</html>
